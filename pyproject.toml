[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "curiosity-meds"
version = "0.1.0"
description = "Curiosity (CoMET) generative medical event model: Qwen2 decoder pretrained on tokenized MEDS timelines, zero-shot task prediction by Monte Carlo generation of future timelines."
readme = "README.md"
authors = [{name = "Florent Pollet", email = "flo1.raymond@gmail.com"}]

requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "meds-algorithm[data]==0.4.0a5"]

[project.optional-dependencies]
orchestration = ["meds-algorithm[orchestration]==0.4.0a5"]
# meds-evaluation is pinned to the version MEDS-DEV evaluates predictions with.
test = ["meds-algorithm[conformance]==0.4.0a5"]

[project.urls]
Repository = "https://github.com/florian6973/meds-algo-curiosity"

[project.scripts]
curiosity-meds = "curiosity_meds.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curiosity_meds"]

# Keep one editable source; copy only portable defaults into the installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"configs/runs" = "curiosity_meds/resources/runs"
"algorithms" = "curiosity_meds/resources/algorithms"

[tool.hatch.build.targets.sdist]
include = ["/src", "/configs/runs", "/algorithms", "/tests", "/scripts", "/docs", "/README.md", "/RELEASING.md", "/CHANGELOG.md", "/LICENSE*", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "meds_dev: opt-in end-to-end execution through MEDS-DEV",
  "real_data: opt-in MIMIC-IV demo end-to-end conformance",
  "slow: integration tests that create isolated environments or run a full algorithm profile",
]
